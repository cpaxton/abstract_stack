minimum_pre_commit_version: '4.0'
default_install_hook_types: [pre-commit, pre-push]
exclude: ^(third_party/|outputs/|build/|dist/|\.venv/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: ^uv\.lock$
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-case-conflict
      - id: debug-statements
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      - id: shell-syntax
        name: shell syntax
        entry: bash
        args: [-c, 'for source_path in "$@"; do bash -n "$source_path" || exit; done', --]
        language: system
        types: [shell]
      - id: physics-tests
        name: physics tests
        entry: scripts/test.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
