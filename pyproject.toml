[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abstract-stack"
version = "0.1.0"
description = "Contact-rich bimanual shelf stocking in simulation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Chris Paxton" }]
dependencies = [
    "mujoco>=3.4,<4",
    "numpy>=1.24,<2",
    "pillow>=10",
    "emet[sim] @ git+https://github.com/cpaxton/home_robot_v3.git@main",
]

[project.scripts]
abstract-stack = "abstract_stack.cli:main"

[project.urls]
Repository = "https://github.com/cpaxton/abstract_stack"

[project.optional-dependencies]
curriculum = ["gymnasium>=1.2,<2"]

[dependency-groups]
dev = ["pre-commit>=4,<5", "pytest>=8", "ruff==0.17.5"]
rollout = ["mujoco==3.17.0", "mujoco-warp==3.17.0", "numpy==1.26.4"]
ci = [
    { include-group = "dev" },
    "mujoco>=3.4,<4",
    "numpy>=1.24,<2",
    "pillow>=10",
    "gymnasium>=1.2,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "mabel: requires the downloaded MABEL model",
    "rendering: requires a supported graphics context and encoding tools",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["abstract_stack*"]

[tool.setuptools.package-data]
abstract_stack = ["configs/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
