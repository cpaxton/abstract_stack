[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abstract-stack"
version = "0.1.0"
description = "Contact-rich bimanual shelf stocking in simulation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Chris Paxton" }]
dependencies = [
    "mujoco>=3.4,<4",
    "numpy>=1.24,<2",
    "pillow>=10",
    "emet[sim] @ git+https://github.com/cpaxton/home_robot_v3.git@main",
]

[project.optional-dependencies]
# Browser teleoperation host (abstract-stack teleop); see docs/web_teleop/README.md.
teleop = [
    "starlette>=0.41,<2",
    "uvicorn[standard]>=0.32,<1",
    "fast-simplification>=0.1.9,<1",
    "segno>=1.6,<2",
]

[project.scripts]
abstract-stack = "abstract_stack.cli:main"

[project.urls]
Repository = "https://github.com/cpaxton/abstract_stack"

[dependency-groups]
dev = ["pre-commit>=4,<5", "pytest>=8", "ruff==0.17.5"]
ci = [
    { include-group = "dev" },
    "mujoco>=3.4,<4",
    "numpy>=1.24,<2",
    "pillow>=10",
    "starlette>=0.41,<2",
    "uvicorn[standard]>=0.32,<1",
    "fast-simplification>=0.1.9,<1",
    "segno>=1.6,<2",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "mabel: requires the downloaded MABEL model",
    "rendering: requires a supported graphics context and encoding tools",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["abstract_stack*"]

[tool.setuptools.package-data]
abstract_stack = ["configs/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
